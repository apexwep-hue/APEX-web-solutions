<style>
:root{--bg:#050507;--bgs:rgba(5,5,7,.5);--glass:rgba(255,255,255,.05);--line:rgba(255,255,255,.12);--tx:#f2f2f4;--mut:#a0a0aa;--ac:#fff}
[data-theme=light]{--bg:#f1f1ef;--bgs:rgba(241,241,239,.62);--glass:rgba(255,255,255,.6);--line:rgba(0,0,0,.14);--tx:#0b0b0d;--mut:#55555e;--ac:#0b0b0d}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:400 16px/1.75 "IBM Plex Sans Arabic","Space Grotesk",system-ui,sans-serif;overflow:hidden;height:100vh;transition:background .4s,color .4s}
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;transition:opacity .6s}
body:not([data-page=home]) #gl{opacity:.55}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
header{position:fixed;top:14px;left:50%;transform:translateX(-50%);width:min(1100px,94vw);z-index:5;display:flex;align-items:center;gap:10px;padding:8px 16px;border-radius:999px}
.brand{display:flex;align-items:center;gap:7px;font:700 15px "Space Grotesk",sans-serif;white-space:nowrap;direction:ltr}
.brand svg{stroke:var(--ac)}.brand svg path:last-child{fill:var(--ac);stroke:none}
nav{display:flex;gap:2px;margin-inline:auto;overflow-x:auto;scrollbar-width:none}
nav a{padding:6px 12px;border-radius:999px;color:var(--mut);font-size:14px;white-space:nowrap;transition:.2s}
nav a:hover,nav a.on{color:var(--tx);background:var(--glass);box-shadow:inset 0 0 0 1px var(--line)}
.btn{display:inline-block;border:1px solid var(--line);background:var(--glass);color:var(--tx);padding:10px 22px;border-radius:12px;font:600 15px/1.4 inherit;font-family:inherit;cursor:pointer;transition:.2s;text-align:center}
.btn:hover{border-color:var(--ac)}
.btn.pri{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.btn.pri:hover{opacity:.85}
.btn.sm{padding:7px 14px;font-size:14px}
select.btn{appearance:none;padding-inline:12px}select option{background:var(--bg);color:var(--tx)}
/* each section = its own page */
.page{position:fixed;inset:0;z-index:1;padding:96px 6vw 36px;overflow-y:auto;display:flex;opacity:0;visibility:hidden;transform:scale(.985);transition:opacity .55s,transform .55s,visibility 0s .55s}
.page.on{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.in{margin:auto;width:100%;max-width:1100px}
#home .in{text-align:center;max-width:780px}
#home .txt{padding:36px 30px;border-radius:28px;background:var(--bgs)}
h1{font:700 clamp(30px,5.4vw,58px)/1.15 "Space Grotesk","IBM Plex Sans Arabic",sans-serif;letter-spacing:-.02em}
.sub{color:var(--mut);margin:16px auto 28px;max-width:560px}
.cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
h2{font-size:clamp(26px,3.6vw,40px);line-height:1.3;margin-bottom:8px}
.lead{color:var(--mut);max-width:640px;margin-bottom:30px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.card{border-radius:18px;padding:22px;transition:.25s;display:flex;flex-direction:column;gap:8px}
.card:hover{transform:translateY(-3px);border-color:var(--ac)}
.card h3{font-size:18px;line-height:1.4}.card p,.card small{color:var(--mut);font-size:15px}.card p{flex:1}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
#work .in{margin-block:0 auto}
#wiz{border-radius:26px;padding:clamp(18px,4vw,36px);max-width:820px}
.bar{height:4px;background:var(--line);border-radius:4px;margin-bottom:22px;overflow:hidden}
.bar i{display:block;height:100%;width:25%;background:var(--ac);transition:width .4s}
.step{display:none}.step.on{display:block}.step h3{margin-bottom:14px;font-size:20px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.opt{padding:13px 16px;border-radius:12px;border:1px solid var(--line);background:var(--glass);color:var(--tx);font:inherit;cursor:pointer;text-align:start;transition:.2s}
.opt:hover{border-color:var(--ac)}.opt.sel{background:var(--ac);color:var(--bg);border-color:var(--ac)}
label{display:block;font-size:14px;color:var(--mut);margin:12px 0 6px}
input,textarea,select.f{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--glass);color:var(--tx);font:inherit}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.nav2{display:flex;justify-content:space-between;margin-top:22px;gap:10px;flex-wrap:wrap}
.err{color:#ff8f8f;font-size:14px;min-height:22px;margin-top:8px}.ok{color:var(--mut);font-size:14px}
.qr{background:#fff;border-radius:16px;padding:8px;width:170px;display:block}.qr img{width:100%;display:block;border-radius:10px}
.br{display:flex;flex-direction:column;gap:2px;padding:12px 0;border-top:1px solid var(--line)}
.copy{margin-top:18px;color:var(--mut);font-size:13px;text-align:center}
#menuBtn{display:grid;place-items:center;padding:8px 12px}
#menuBg{position:fixed;inset:0;z-index:4;display:none}#menuBg.open{display:block}
#menuPanel{position:fixed;top:70px;inset-inline-end:max(3vw,calc(50vw - 550px));width:min(300px,92vw);z-index:6;border-radius:20px;padding:8px;opacity:0;visibility:hidden;transform:translateY(-8px) scale(.98);transform-origin:top;transition:opacity .25s,transform .25s,visibility 0s .25s}
#menuPanel.open{opacity:1;visibility:visible;transform:none;transition-delay:0s}
#menuPanel a{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:12px;font-size:16px;transition:.2s}
#menuPanel a span{font:500 12px "Space Grotesk",sans-serif;color:var(--mut);width:22px;direction:ltr}
#menuPanel a:hover{background:var(--glass)}
#menuPanel a.on{background:var(--ac);color:var(--bg)}#menuPanel a.on span{color:inherit}
@media(max-width:900px){nav{display:none}.brand{margin-inline-end:auto}}
@media(max-width:760px){header{gap:7px;padding:8px 12px}.brand{font-size:14px}.two{grid-template-columns:1fr}#waTop{display:none}.page{padding:84px 5vw 28px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
let L=0;try{L=+localStorage.getItem('lang')||0}catch(e){}
const tt=k=>T[k][L],wa=t=>`https://wa.me/${PHONE}?text=${encodeURIComponent(t)}`;
const st={service:'',biz:'',host:''};let step=1;

function applyLang(){
  const d=document.documentElement;d.lang=['en','ar','de','tr'][L];d.dir=L===1?'rtl':'ltr';$('#lang').value=L;
  $$('[data-i]').forEach(e=>e.textContent=tt(e.dataset.i));
  $$('[data-ph]').forEach(e=>{e.placeholder=tt(e.dataset.ph);e.setAttribute('aria-label',e.placeholder)});
  $('#nav').innerHTML=PG.map(p=>`<a href="#${p}">${tt(p)}</a>`).join('');
  $('#menuPanel').innerHTML=PG.map((p,n)=>`<a role="menuitem" href="#${p}"><span>0${n+1}</span>${tt(p)}</a>`).join('');
  $('#svcGrid').innerHTML=SV.map(k=>`<div class="card glass"><h3>${tt(k)}</h3><p>${tt('sd_'+k.slice(2))}</p><div class="row"><button class="btn sm" data-order="${k}" type="button">${tt('b_order')}</button></div></div>`).join('');
  $('#workGrid').innerHTML=WORKS.map(w=>`<article class="card glass"><h3 dir="ltr" style="text-align:start">${w[0]}</h3><p>${tt(w[1])}</p><div class="row"><a class="btn pri sm" href="${w[2]}" target="_blank" rel="noopener">${tt('live')}</a><button class="btn sm" data-biz="${w[3]}" type="button">${tt('similar')}</button></div></article>`).join('');
  const f=(k,l)=>$(`.opts[data-k=${k}]`).innerHTML=l.map(v=>`<button type="button" class="opt${st[k]===v?' sel':''}" data-v="${v}">${tt(v)}</button>`).join('');
  f('service',SO);f('biz',BZ);f('host',HO);
  const i=$('#tld').selectedIndex;$('#tld').innerHTML=['.com','.net','.org',tt('tld_l'),tt('tld_c')].map((o,n)=>`<option value="${n}">${o}</option>`).join('');$('#tld').selectedIndex=Math.max(i,0);
  document.title='Apex Web Solutions';markNav();
}
function markNav(){const h=location.hash.slice(1)||'home';$$('#nav a,#menuPanel a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+h))}
function show(){let id=location.hash.slice(1);if(!PG.includes(id))id='home';
  $$('.page').forEach(p=>p.classList.toggle('on',p.id===id));$('#'+id).scrollTop=0;document.body.dataset.page=id;markNav()}
addEventListener('hashchange',show);

/* theme + language */
function setTheme(t){document.documentElement.dataset.theme=t;$('#thm').textContent=t==='dark'?'☀':'☾';$('#thm').setAttribute('aria-label',t==='dark'?'Light mode':'Dark mode');
  try{localStorage.setItem('theme',t)}catch(e){}dispatchEvent(new Event('themechange'))}
$('#thm').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
$('#lang').onchange=e=>{L=+e.target.value;try{localStorage.setItem('lang',L)}catch(x){}applyLang();wstep(step)};
let th='dark';try{th=localStorage.getItem('theme')||'dark'}catch(e){}

/* links */
['waTop','waBtn'].forEach(i=>$('#'+i).href=wa('Hello Apex Web Solutions, I would like to ask about your services.'));

/* wizard */
document.addEventListener('click',e=>{
  const o=e.target.closest('.opt');if(o){const g=o.parentElement.dataset.k;st[g]=o.dataset.v;$$('.opt',o.parentElement).forEach(b=>b.classList.toggle('sel',b===o));$('#err').textContent='';return}
  const b=e.target.closest('[data-order],[data-biz]');if(!b)return;
  if(b.dataset.order)st.service=b.dataset.order;if(b.dataset.biz)st.biz=b.dataset.biz;
  applyLang();wstep(b.dataset.order?(st.biz?3:2):(st.service?3:1));location.hash='order'});
function wstep(n){step=Math.max(1,Math.min(4,n));$$('.step').forEach(s=>s.classList.toggle('on',+s.dataset.s===step));$('#prog').style.width=step*25+'%';
  $('#back').style.visibility=step>1?'visible':'hidden';$('#next').hidden=step===4;['sendWa','sendIg','sendMail'].forEach(i=>$('#'+i).hidden=step!==4);$('#err').textContent='';$('#ok').textContent=''}
$('#back').onclick=()=>wstep(step-1);
$('#next').onclick=()=>{const n={1:['service','e1'],2:['biz','e2'],3:['host','e3']}[step];if(n&&!st[n[0]]){$('#err').textContent=tt(n[1]);return}wstep(step+1)};
const ar=k=>T[k][1];
function msg(){return `طلب خدمة جديد - Apex Web Solutions\nالخدمة: ${ar(st.service)}\nالنشاط: ${ar(st.biz)}\nالدومين: ${$('#tld').selectedOptions[0].text}\nالاستضافة: ${ar(st.host)}\nالاسم: ${$('#nm').value}\nالهاتف: ${$('#ph').value}\nالبريد: ${$('#em').value}\nالملاحظات: ${$('#nt').value}`}
const valid=()=>$('#nm').value.trim()&&$('#ph').value.trim()?true:($('#err').textContent=tt('e4'),false);
async function toIG(text,out){try{await navigator.clipboard.writeText(text)}catch(e){}out.textContent=tt('copied');window.open('https://ig.me/m/'+IG,'_blank')}
$('#sendWa').onclick=()=>valid()&&window.open(wa(msg()),'_blank');
$('#sendIg').onclick=()=>valid()&&toIG(msg(),$('#ok'));
$('#sendMail').onclick=()=>valid()&&(location.href=`mailto:${EMAIL}?subject=${encodeURIComponent('طلب خدمة جديد')}&body=${encodeURIComponent(msg())}`);
$('#qf').onsubmit=e=>{e.preventDefault();window.open(wa(`${$('#qn').value}:\n${$('#qm').value}`),'_blank')};
$('#qIg').onclick=()=>{if($('#qm').value.trim())toIG(`${$('#qn').value}:\n${$('#qm').value}`,$('#qIg'))};

function menu(o){$('#menuPanel').classList.toggle('open',o);$('#menuBg').classList.toggle('open',o);$('#menuBtn').setAttribute('aria-expanded',o)}
$('#menuBtn').onclick=()=>menu(!$('#menuPanel').classList.contains('open'));
$('#menuBg').onclick=()=>menu(false);
$('#menuPanel').addEventListener('click',e=>{if(e.target.closest('a'))menu(false)});
addEventListener('keydown',e=>{if(e.key==='Escape')menu(false)});
addEventListener('hashchange',()=>menu(false));
applyLang();setTheme(th);wstep(1);show();
</script>

<script type="module">
import * as THREE from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
try{
const cv=document.getElementById('gl'),reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const r=new THREE.WebGLRenderer({canvas:cv,antialias:true});
r.setPixelRatio(Math.min(devicePixelRatio,2));r.toneMapping=THREE.ACESFilmicToneMapping;
const scene=new THREE.Scene();
scene.environment=new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(),.04).texture;
const cam=new THREE.PerspectiveCamera(40,1,.1,100);
const white=new THREE.Color(.85,.85,.9);
const glow=new THREE.PointLight(white,45,9,1.6);scene.add(glow);
const rim=new THREE.DirectionalLight(0xffffff,1.2);rim.position.set(-4,5,4);scene.add(rim);
const group=new THREE.Group();scene.add(group);

const C=7,R=4,W=13,H=7,rnd=(a,b)=>a+Math.random()*(b-a),P=[];
for(let j=0;j<=R;j++){P[j]=[];for(let i=0;i<=C;i++)P[j][i]=[(i/C-.5)*W+(i%C?rnd(-.5,.5):0),(.5-j/R)*H+(j%R?rnd(-.45,.45):0)]}
const meshes=[];
for(let j=0;j<R;j++)for(let i=0;i<C;i++){
  const q=[P[j][i],P[j][i+1],P[j+1][i+1],P[j+1][i]],cx=q.reduce((s,p)=>s+p[0],0)/4,cy=q.reduce((s,p)=>s+p[1],0)/4;
  const sh=new THREE.Shape();q.forEach((p,k)=>{const x=(p[0]-cx)*.94,y=(p[1]-cy)*.94;k?sh.lineTo(x,y):sh.moveTo(x,y)});
  const g=new THREE.ExtrudeGeometry(sh,{depth:.35,bevelEnabled:true,bevelSize:.03,bevelThickness:.03,bevelSegments:2});
  const m=new THREE.MeshPhysicalMaterial({color:0x17171b,roughness:.22,metalness:.1,clearcoat:1,clearcoatRoughness:.08,ior:1.3,
    iridescence:.2,iridescenceIOR:1.3,iridescenceThicknessRange:[200,500],emissive:white,emissiveIntensity:0});
  const mesh=new THREE.Mesh(g,m);mesh.position.set(cx,cy,0);group.add(mesh);
  mesh.userData={hx:cx,hy:cy,ph:rnd(0,6.28),sp:rnd(.2,.5),hv:0,p:0,delay:Math.hypot(cx,cy)*.05,
    dir:new THREE.Vector3(rnd(-1,1)+cx*.15,rnd(-1,1)+cy*.15,rnd(.6,1.6)).normalize(),spin:new THREE.Vector3(rnd(-1,1),rnd(-1,1),rnd(-1,1))};
  meshes.push(mesh)}

/* theme: white / black */
const TH={dark:{bg:0x050507,sh:0x17171b,env:.35,gl:45},light:{bg:0xf1f1ef,sh:0xdededf,env:1,gl:18}};
function theme(){const c=document.documentElement.dataset.theme==='light'?TH.light:TH.dark;
  r.setClearColor(c.bg);scene.environmentIntensity=c.env;glow.intensity=c.gl;meshes.forEach(m=>m.material.color.setHex(c.sh))}
addEventListener('themechange',theme);theme();

const ptr=new THREE.Vector2(),ray=new THREE.Raycaster(),LIFT=1.1,tilt=[0,0];let hover=null,shat=false,t0=0,rt=0;
addEventListener('pointermove',e=>ptr.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1));
/* shards break apart, then re-form behind the next page */
addEventListener('shatter',()=>{shat=true;t0=performance.now()/1000;clearTimeout(rt);rt=setTimeout(()=>{shat=false;t0=performance.now()/1000},1500)});
function size(){r.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.position.z=innerWidth<innerHeight?15:10;cam.updateProjectionMatrix()}
addEventListener('resize',size);size();

const clock=new THREE.Clock(),v=new THREE.Vector3();
r.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime,now=performance.now()/1000;
  tilt[0]+=(ptr.x*.18-tilt[0])*.06;tilt[1]+=(-ptr.y*.12-tilt[1])*.06;group.rotation.set(tilt[1],tilt[0],0);
  ray.setFromCamera(ptr,cam);const hit=shat?[]:ray.intersectObjects(meshes,false);hover=hit.length?hit[0].object:null;
  v.set(ptr.x,ptr.y,.5).unproject(cam).sub(cam.position).normalize();glow.position.copy(cam.position).addScaledVector(v,cam.position.z-1.6);
  for(const m of meshes){const u=m.userData,d=reduce?0:1;
    u.hv+=((m===hover?1:0)-u.hv)*.12;
    if(now-t0>u.delay)u.p=Math.min(1,Math.max(0,u.p+(shat?1:-1)*dt/1.4));
    const e=u.p*u.p,dr=Math.sin(t*u.sp+u.ph)*.12*d;
    m.position.set(u.hx+u.dir.x*e*18,u.hy+u.dir.y*e*18,dr+u.hv*LIFT+u.dir.z*e*14);
    m.rotation.set(u.hv*.45+u.spin.x*e*7+Math.sin(t*u.sp+u.ph)*.03*d,u.spin.y*e*7,u.spin.z*e*7);
    const mt=m.material;mt.iridescence=.2+u.hv*.6;mt.emissiveIntensity=u.hv*.35;mt.opacity=1-e;mt.transparent=u.p>0;m.visible=u.p<.995}
  r.render(scene,cam)});
}catch(err){console.warn('WebGL unavailable',err)}
</script>
